<!doctype html>
<html lang="en-us">
  <head>
    <!-- MUST be first, and must run before anything else touches the page.
         SharedArrayBuffer requires the document to be cross-origin isolated,
         which requires Cross-Origin-Opener-Policy: same-origin plus
         Cross-Origin-Embedder-Policy: require-corp on the wire. GitHub Pages
         cannot send response headers at all - the Pages API takes exactly
         cname, https_enforced, build_type and source - so this service worker
         synthesises them client-side: it registers, reloads the page once, and
         thereafter rewrites every response as it passes through.
         Without it this build dies in preRun with
         "DataCloneError: SharedArrayBuffer transfer requires
         self.crossOriginIsolated", before main() exists.
         Drop this line if you ever serve from a host that sends the real
         headers - the two are alternatives, and running both charges every
         cold visit a register-and-reload for nothing. -->
    <script src="enable-threads.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Emscripten-Generated Code</title>
    <style>{{{ SHELL_CSS }}}</style>
  </head>
  <body>
    <a href="http://emscripten.org">{{{ SHELL_LOGO }}}</a>

    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <span id='controls'>
      <span><input type="button" value="Load files..." onclick="document.getElementById('loadFiles').click()">
        <input type="file" id="loadFiles" multiple hidden> or drop them on the page &nbsp;&nbsp;&nbsp;</span>
      <span><input type="checkbox" id="resize">Resize canvas</span>
      <span><input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer &nbsp;&nbsp;&nbsp;</span>
      <span><input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked,
                                                                                document.getElementById('resize').checked)">
      </span>
    </span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8"></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // As a default initial behavior, pop up an alert when webgl context is lost. To make your
      // application robust, you may want to override this behavior before shipping!
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      var setStatus = (text) => {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
        if (text === setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        // if this is a progress update, skip it if too soon
        if (m && now - setStatus.last.time < 30) return;
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2])*100;
          progressElement.max = parseInt(m[4])*100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.style.display = 'none';
        }
        statusElement.innerHTML = text;
      };

#if MODULARIZE && !EXPORT_ES6
      var moduleArgs = {
#else
      var Module = {
#endif
        print(...args) {
          console.log(...args);
          // These replacements are necessary if you render to raw HTML
          //text = text.replace(/&/g, "&amp;");
          //text = text.replace(/</g, "&lt;");
          //text = text.replace(/>/g, "&gt;");
          //text = text.replace('\n', '<br>', 'g');
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      setStatus('Downloading...');
      window.onerror = window.onunhandledrejection = () => {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
#if MODULARIZE && !EXPORT_ES6
    <script type='text/javascript'>
      {{{ EXPORT_NAME }}}(moduleArgs);
    </script>
#endif
    <script type='text/javascript'>
      // Picked or dropped files go into one directory of the virtual filesystem together, so a
      // .cue finds the .bin files it names, then the cue (or the only file) is opened the way a
      // desktop drop is. This replaces SDL's own drop handling, which puts every dropped file in
      // a directory of its own.
      var loadCount = 0;
      function loadFiles(files) {
        var list = Array.from(files || []);
        if (!list.length) return;
        var dir = '/tmp/load/' + (loadCount++);
        try { FS.mkdir('/tmp/load'); } catch (e) {}
        FS.mkdir(dir);
        Promise.all(list.map((f) => f.arrayBuffer().then((b) => FS.writeFile(dir + '/' + f.name, new Uint8Array(b)))))
          .then(() => {
            var pick = list.find((f) => f.name.toLowerCase().endsWith('.cue')) || list[0];
            Module.ccall('pcsxOpenFile', null, ['string'], [dir + '/' + pick.name]);
          })
          .catch((e) => console.error('Loading ' + list.map((f) => f.name).join(', ') + ' failed:', e));
      }
      document.getElementById('loadFiles').addEventListener('change', (e) => {
        loadFiles(e.target.files);
        e.target.value = '';
      });
      var hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
      window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); }, true);
      window.addEventListener('drop', (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        e.stopPropagation();
        loadFiles(e.dataTransfer.files);
      }, true);
    </script>
  </body>
</html>
