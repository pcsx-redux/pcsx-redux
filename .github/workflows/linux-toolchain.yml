name: Linux CI toolchain

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - name: Update packages registry
        run: sudo apt-get update
      - name: Install pre-reqs
        run: sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev
      - name: Build toolchains
        run: sudo bash src/mips/tools/linux-mips/spawn-compiler.sh
      - name: Build OpenBIOS with it
        run: make -C src/mips/openbios -j 6 all
      - name: Build psyqo examples with it
        run: for d in src/mips/psyqo/examples/* src/mips/psyqo-paths/examples/* src/mips/psyqo-lua/examples/*; do if [ -f "$d/Makefile" ]; then make -C "$d" -j 6 all TEST=true; fi; done
