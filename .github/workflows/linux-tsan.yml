name: Linux CI tsan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/pcsx-redux/pcsx-redux-build:latest
      env:
        TEST_RESULTS: /tmp/test-results
        BUILD: tsan
    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - run: |
          make -j 2 all pcsx-redux-tests
          make -C src/mips/openbios -j 2 BUILD=Release
          cp src/mips/openbios/openbios.bin src/mips/openbios/openbios.elf .
          make -C src/mips/openbios clean
          make -C src/mips/tests -j 2 PCSX_TESTS=true BUILD=Release
          cp ./openbios.bin ./openbios.elf src/mips/openbios/
          make -C src/mips/monitor/hosts/retail -j 2 BUILD=LTO
          DBUS_SESSION_BUS_ADDRESS="disabled:" xvfb-run ./pcsx-redux -stdout -lua_stdout -testmode -no-gui-log -exec "dofile 'src/mips/tests/cdrom/common/create-test-iso.lua'"
      - name: Test
        env:
          DBUS_SESSION_BUS_ADDRESS: "disabled:"
        run: |
          export GTEST_OUTPUT=xml:${TEST_RESULTS}/
          export PCSX_TEST_REPORT_DIR=${TEST_RESULTS}
          mkdir -p $TEST_RESULTS
          xvfb-run ./pcsx-redux-tests
      - name: Test summary
        if: always()
        run: python3 ./.github/scripts/test-summary.py "$TEST_RESULTS" "Tests, TSan" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-tsan
          path: ${{ env.TEST_RESULTS }}
          if-no-files-found: ignore
          retention-days: 7
