name: Linux CI ubsan

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubsan:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pcsx-redux/pcsx-redux-build:latest
      env:
        TEST_RESULTS: /tmp/test-results
        BUILD: ubsan
    steps:
      - uses: actions/checkout@v3
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - uses: n1hility/cancel-previous-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          make -j 2 all pcsx-redux-tests
          make -C src/mips/openbios -j 2 BUILD=Release
          cp src/mips/openbios/openbios.bin src/mips/openbios/openbios.elf .
          make -C src/mips/openbios clean
          make -C src/mips/tests -j 2 PCSX_TESTS=true BUILD=Release
          cp ./openbios.bin ./openbios.elf src/mips/openbios/
          make -C src/mips/monitor/hosts/retail -j 2 BUILD=LTO
          xvfb-run ./pcsx-redux -stdout -lua_stdout -testmode -no-gui-log -exec "dofile 'src/mips/tests/cdrom/common/create-test-iso.lua'"
      - name: Test
        run: |
          export GTEST_OUTPUT=xml:${TEST_RESULTS}/
          export PCSX_TEST_REPORT_DIR=${TEST_RESULTS}
          mkdir -p $TEST_RESULTS
          xvfb-run ./pcsx-redux-tests
      - name: Test summary
        if: always()
        run: python3 ./.github/scripts/test-summary.py "$TEST_RESULTS" "Tests, UBSan" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubsan
          path: /tmp/test-results
          if-no-files-found: ignore
          retention-days: 7
