name: chores

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen-i18n:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Regenerate i18n files
        run: make regen-i18n
      - name: Cleanup
        run: rm -f i18n/*~
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CHORES_PAT }}
          commit-message: "[Chores] Regen i18n"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: chores-i18n
          delete-branch: true
          title: "[Chores] Regen i18n"
          draft: false

  code-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - name: Format code
        run: ./tools/code-format/format.sh
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CHORES_PAT }}
          commit-message: "[Chores] Format code"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: chores-code-format
          delete-branch: true
          title: "[Chores] Format code"
          draft: false

  export-support:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter repository
        env:
          FILTER_BRANCH_SQUELCH_WARNING: 1
        run: |
          cp -rv .github/filter-support /tmp
          /tmp/filter-support/filter.sh
      - name: Pushing result
        env:
          PAT: ${{ secrets.EXPORT_PAT }}
        run: |
          git config -l | grep 'http\..*\.extraheader' | cut -d= -f1 | xargs -L1 git config --unset-all
          git remote add support "https://rixnobis:$PAT@github.com/pcsx-redux/support.git"
          git push --force "https://rixnobis:$PAT@github.com/pcsx-redux/support.git" main
