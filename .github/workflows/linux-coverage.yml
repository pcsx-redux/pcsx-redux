name: Linux CI coverage

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pcsx-redux/pcsx-redux-build:latest
      env:
        TEST_RESULTS: /tmp/test-results
        BUILD: Coverage
        CPPFLAGS: -Wformat -Werror=format-security
    steps:
      - name: Update lcov, because https://bugs.launchpad.net/ubuntu/+source/lcov/+bug/2029924
        run: |
          apt install -y cpanminus
          cpanm DateTime
          cpanm Capture::Tiny
          wget https://github.com/linux-test-project/lcov/releases/download/v2.0/lcov-2.0.tar.gz
          tar xf lcov-2.0.tar.gz
          cd lcov-2.0
          make install
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - run: |
          make -j 2 all pcsx-redux-tests
          make -C src/mips/openbios -j 2 BUILD=Release
          cp src/mips/openbios/openbios.bin .
      - run: |
          make -C src/mips/openbios clean
          make -C src/mips/tests -j 2 PCSX_TESTS=true BUILD=Release
          cp ./openbios.bin src/mips/openbios/
      - run: |
          make -C src/mips/monitor/hosts/retail -j 2 BUILD=LTO
          xvfb-run catchsegv ./pcsx-redux -stdout -lua_stdout -testmode -no-gui-log -exec "dofile 'src/mips/tests/cdrom/create-test-iso.lua'"
      - name: Test
        run: |
          xvfb-run catchsegv ./pcsx-redux-tests
      - name: Produce code coverage
        run: |
          apt install -y luarocks luajit
          luarocks install luacov
          luarocks install luacov-reporter-lcov
          luacov -r lcov
          lcov --ignore-errors mismatch --directory . --capture --output-file coverage.info
      - uses: codecov/codecov-action@v2
