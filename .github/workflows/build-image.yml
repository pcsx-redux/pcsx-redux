name: Build image

on:
  push:
    branches:
      - main
    paths:
      - 'tools/build/Dockerfile'
      - 'tools/linux-mips/spawn-compiler.sh'
      - '.dockerignore'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pcsx-redux/pcsx-redux-build

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # latest is the general build image. noble is only for packaging: an
        # AppImage needs the glibc it was built against, and 24.04 is the oldest
        # release we want it to run on.
        tag: [latest, noble]
        arch: [amd64, arm64]
        include:
          - tag: latest
            base: ubuntu:26.04
          - tag: noble
            base: ubuntu:24.04
            gxx: '15'
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/build/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE=${{ matrix.base }}
            GXX_VERSION=${{ matrix.gxx }}
          cache-from: type=gha,scope=${{ matrix.tag }}-${{ matrix.platform }}
          cache-to: type=gha,mode=min,scope=${{ matrix.tag }}-${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.tag }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    strategy:
      matrix:
        tag: [latest, noble]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.tag }}-*
          merge-multiple: true
      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the multi-arch tag
        run: |
          docker buildx imagetools create -t $IMAGE:${{ matrix.tag }} \
            $(cd /tmp/digests && printf "$IMAGE@sha256:%s " *)
      - name: Check what landed
        run: |
          docker buildx imagetools inspect $IMAGE:${{ matrix.tag }}
