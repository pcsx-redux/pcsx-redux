trigger:
- main

jobs:
- job: build
  # The VS build alone takes ~40 minutes, so the default 60 is not enough
  # for the MIPS build and pcsxrunner on top of it.
  timeoutInMinutes: 120
  pool:
    vmImage: 'windows-2025-vs2026'

  variables:
    solution: 'vsprojects/pcsx-redux.sln'
    buildConfiguration: 'ReleaseCLI'

  steps:
  - checkout: self
    submodules: false
  - task: Bash@3
    inputs:
      filePath: '.github/scripts/update-submodules.sh'
  - task: NuGetToolInstaller@1

  - task: NuGetCommand@2
    inputs:
      restoreSolution: '$(solution)'

  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        wget https://christiansoltenborn.gallerycdn.vsassets.io/extensions/christiansoltenborn/googletestadapter/0.17.1.1389/1571333606547/GoogleTestAdapter-0.17.1.vsix -OutFile GoogleTestAdapter-0.17.1.zip

  - task: ExtractFiles@1
    inputs:
      archiveFilePatterns: 'GoogleTestAdapter-0.17.1.zip'
      destinationFolder: 'GoogleTestAdapter'
      cleanDestinationFolder: true

  - task: CopyFiles@2
    inputs:
      Contents: |
        LICENSE
        i18n/*.po
      TargetFolder: '$(build.artifactStagingDirectory)/assets'

  - task: CopyFiles@2
    inputs:
      Contents: |
        third_party/noto/*
      TargetFolder: '$(build.artifactStagingDirectory)/assets/fonts'
      FlattenFolders: true

  - task: CopyFiles@2
    inputs:
      Contents: |
        resources/*.lua
      TargetFolder: '$(build.artifactStagingDirectory)/assets'
      FlattenFolders: true

  - task: VSBuild@1
    inputs:
      solution: '$(solution)'
      platform: 'x64'
      maximumCpuCount: false
      configuration: '$(buildConfiguration)'

  - task: CopyFiles@2
    inputs:
      Contents: |
        vsprojects/x64/ReleaseCLI/pcsx-redux.exe
        vsprojects/x64/ReleaseCLI/crashpad_handler.exe
        vsprojects/x64/ReleaseWithClangCL/authoring.exe
        vsprojects/x64/ReleaseWithClangCL/exe2elf.exe
        vsprojects/x64/ReleaseWithClangCL/exe2exe.exe
        vsprojects/x64/ReleaseWithClangCL/exe2iso.exe
        vsprojects/x64/ReleaseWithClangCL/exe2sys573.exe
        vsprojects/x64/ReleaseWithClangCL/modconv.exe
        vsprojects/x64/ReleaseWithClangCL/xmconv.exe
        vsprojects/x64/ReleaseWithClangCL/ps1-packer.exe
        vsprojects/x64/ReleaseWithClangCL/psyq-obj-parser.exe
        vsprojects/x64/ReleaseCLI/*.dll
      TargetFolder: '$(build.artifactStagingDirectory)/binaries'

  - task: CopyFiles@2
    inputs:
      Contents: |
        vsprojects/x64/ReleaseCLI/*.pdb
      TargetFolder: '$(build.artifactStagingDirectory)/pdbs'

  - task: VSTest@3
    inputs:
      testSelector: 'testAssemblies'
      testAssemblyVer2: |
        **\*.exe
        !**\crashpad_handler.exe
        !**\authoring.exe
        !**\exe2elf.exe
        !**\exe2exe.exe
        !**\exe2iso.exe
        !**\exe2sys573.exe
        !**\mdec.exe
        !**\modconv.exe
        !**\xmconv.exe
        !**\midi2psm.exe
        !**\midi2spd.exe
        !**\pcsx-redux.exe
        !**\pcsx-wrapper.exe
        !**\pcsxrunner.exe
        !**\ps1-packer.exe
        !**\psyq-obj-parser.exe
        !third_party\**\*.exe
      searchFolder: '$(System.DefaultWorkingDirectory)'
      pathtoCustomTestAdapters: 'GoogleTestAdapter'
      codeCoverageEnabled: True

  # pcsxrunner boots guest code, so it needs openbios.bin and the test
  # binaries built by the MIPS toolchain, plus the test.cue image.
  - task: PowerShell@2
    displayName: 'Install MIPS toolchain'
    inputs:
      targetType: 'inline'
      script: |
        $dir = "$(Agent.TempDirectory)\mips-toolchain"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        Copy-Item mips.ps1 $dir
        powershell -ExecutionPolicy Bypass -File "$dir\mips.ps1" install 16.2.0
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Write-Host "##vso[task.prependpath]$dir\mips\bin"

  - task: Bash@3
    displayName: 'Build openbios and MIPS tests'
    inputs:
      targetType: 'inline'
      script: |
        set -ex
        which make mipsel-none-elf-gcc
        make -C src/mips/tests -j 2 PCSX_TESTS=true
        make -C src/mips/openbios -j 2 all
        cp src/mips/openbios/openbios.bin .
        make -C src/mips/openbios clean
        make -C src/mips/tests -j 2 PCSX_TESTS=true
        cp ./openbios.bin src/mips/openbios/
        make -C src/mips/monitor/hosts/retail -j 2

  - task: PowerShell@2
    displayName: 'Create test.cue'
    timeoutInMinutes: 10
    inputs:
      targetType: 'inline'
      script: |
        vsprojects\x64\ReleaseCLI\pcsx-redux.exe -no-ui -stdout -lua_stdout -testmode -no-gui-log -exec "dofile 'src/mips/tests/cdrom/create-test-iso.lua'"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Get-ChildItem test.*

  - task: PowerShell@2
    displayName: 'Run pcsxrunner'
    timeoutInMinutes: 30
    inputs:
      targetType: 'inline'
      script: |
        vsprojects\x64\ReleaseWithClangCL\pcsxrunner.exe --gtest_output=xml:$(Agent.TempDirectory)\pcsxrunner.xml
        exit $LASTEXITCODE

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(Agent.TempDirectory)\pcsxrunner.xml'
      testRunTitle: 'pcsxrunner'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'
